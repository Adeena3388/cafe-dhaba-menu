
<!DOCTYPE html>
<html>

<head>
    <title>Contact - The Cozy Cup Cafe</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>The Cozy Cup Cafe</h1>

    <!-- Navigation Bar -->
    <nav>
        <a href="index.html">Home</a>
        <a href="menu.html">Menu</a>
        <a href="gallery.html">Gallery</a>
        <a href="contact.html">Contact</a>
    </nav>

    <!-- Contact Information -->
    <h2>Contact Us</h2>

    <p>We would love to hear from you!</p>

    <div class="contact-info">
        <h3>Our Cafe Information</h3>

        <p><strong>Cafe Name:</strong> The Cozy Cup Cafe</p>
        <p><strong>Email:</strong> cozycup@example.com</p>
        <p><strong>Phone:</strong> 0300-1234567</p>
        <p><strong>Address:</strong> Visit us at The Cozy Cup Cafe.</p>
    </div>

    <!-- Contact Form -->
    <div class="contact-form">

        <h3>Send Us a Message</h3>

        <form onsubmit="sendMessage(event)">

            <label for="customerName">Your Name:</label>
            <input type="text" id="customerName" required>

            <label for="customerEmail">Your Email:</label>
            <input type="email" id="customerEmail" required>

            <label for="message">Your Message:</label>
            <textarea id="message" rows="5" required></textarea>

            <button type="submit">Send Message</button>

        </form>

    </div>

    <!-- Footer -->
    <footer>
        <p>Thank you for visiting The Cozy Cup Cafe!</p>
    </footer>

    <!-- JavaScript -->
    <script>
        function sendMessage(event)
        {
            event.preventDefault();

            window.alert("Thank you for contacting The Cozy Cup Cafe!");

            console.log("Contact form submitted successfully.");
        }
    </script>

</body>

</html>
